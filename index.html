од вы можете совершить одну атаку бонусным действием."},"Vorpal Sword":{name:"Ворпальный меч",description:"Вы получаете бонус +3 к броскам атаки и урона. Если при броске атаки выпадает 20, вы отрубаете одну из голов цели."},Defender:{name:"Защитник",description:"Вы получаете бонус +3 к броскам атаки и урона. Часть или весь этот бонус можно перенести в КД."},"Holy Avenger":{name:"Святой мститель",description:"Паладин, настроившийся на это оружие, получает бонус +3 и наносит дополнительный урон излучением исчадиям и нежити."},"Luck Blade":{name:"Клинок удачи",description:"Вы получаете бонус +1 к броскам атаки и урона, а также +1 к спасброскам. У меча есть 1к4 − 1 зарядов для заклинания Исполнение желаний."},"Sword of Answering":{name:"Меч ответа",description:"Вы получаете бонус +3 к броскам атаки и урона. Реакцией вы можете совершить рукопашную атаку, когда существо в пределах досягаемости атакует вас."},"Hammer of Thunderbolts":{name:"Молот громовых разрядов",description:"Оружие против великанов, дающее бонус +1 и способное оглушать великанов. При настройке вместе с особыми предметами становится оружием +3."},"Mace of Disruption":{name:"Булава разрушения",description:"При попадании по исчадию или нежити цель получает дополнительно 2к6 урона излучением."},"Mace of Smiting":{name:"Булава сокрушения",description:"Вы получаете бонус +1 к броскам атаки и урона, либо +3 против конструктов. Критическое попадание по конструкту наносит дополнительно 7 урона."},"Mace of Terror":{name:"Булава ужаса",description:"У этого магического оружия 3 заряда. Вы можете потратить 1 заряд, чтобы напугать существ в пределах 30 футов."},"Tentacle Rod":{name:"Жезл щупалец",description:"Этот жезл, созданный дроу, имеет три щупальца, которые атакуют самостоятельно, пока вы держите жезл."},"Dwarven Thrower":{name:"Дварфский метатель",description:"Этот магический боевой молот даёт бонус +3. При метании он наносит дополнительный урон и возвращается в вашу руку."},Oathbow:{name:"Лук клятвы",description:"Наложив стрелу и произнеся командное слово, вы можете поклясться уничтожить врага и получить преимущество на атаки по нему."},"Arrow of Slaying":{name:"Стрела убийства",description:"Если существо указанного типа получает урон от этой стрелы, оно должно пройти спасбросок Телосложения Сл 17 или получить 6к10 колющего урона."},"Moon-Touched Sword":{name:"Меч, тронутый луной",description:"В темноте обнажённый клинок этого меча излучает лунный свет, создавая яркий свет в радиусе 15 футов."},"Silvered Weapon":{name:"Посеребрённое оружие",description:"Оружие, покрытое серебром и эффективное против существ, уязвимых к серебру."},"Unbreakable Arrow":{name:"Неломаемая стрела",description:"Эту стрелу невозможно сломать, кроме как внутри поля антимагии."},"Walloping Ammunition":{name:"Сбивающие боеприпасы",description:"При попадании цель должна успешно пройти спасбросок Силы Сл 10, иначе будет сбита с ног."},"Shield, +1":{name:"Щит +1",description:"Пока вы держите этот щит, вы получаете дополнительный бонус +1 к КД сверх обычного бонуса щита."},"Shield, +2":{name:"Щит +2",description:"Пока вы держите этот щит, вы получаете дополнительный бонус +2 к КД."},"Shield, +3":{name:"Щит +3",description:"Пока вы держите этот щит, вы получаете дополнительный бонус +3 к КД."},"Sentinel Shield":{name:"Щит часового",description:"Пока вы держите этот щит, вы получаете преимущество на броски инициативы и проверки Мудрости (Восприятие)."},"Arrow-Catching Shield":{name:"Щит притягивания стрел",description:"Пока вы используете этот щит, вы получаете бонус +2 к КД против дальнобойных атак."},"Shield of Missile Attraction":{name:"Щит притяжения снарядов",description:"Этот проклятый щит даёт сопротивление урону от дальнобойных атак, но все дальнобойные атаки направляются на вас."},"Animated Shield":{name:"Оживлённый щит",description:"Бонусным действием вы можете заставить щит летать рядом и защищать вас без необходимости держать его."},"Spellguard Shield":{name:"Щит защиты от заклинаний",description:"Вы получаете преимущество на спасброски против заклинаний и магических эффектов."},"Shield of Expression":{name:"Щит выражений",description:"Лицевая сторона этого щита выполнена в форме лица. Вы можете менять выражение этого лица."},"Adamantine Armor":{name:"Адамантиновый доспех",description:"Этот доспех усилен адамантином. Любое критическое попадание по вам становится обычным попаданием."},"Mithral Armor":{name:"Мифрильный доспех",description:"Мифрил — лёгкий и гибкий металл. Если этот доспех обычно даёт помеху на Скрытность, в мифрильной версии помехи нет."},"Mariner's Armor":{name:"Доспех моряка",description:"Пока вы носите этот доспех, ваша скорость плавания равна вашей скорости ходьбы."},"Glamoured Studded Leather":{name:"Зачарованный клёпаный кожаный доспех",description:"Пока вы носите этот доспех, бонусным действием можно изменить его внешний вид."},"Elven Chain":{name:"Эльфийская кольчуга",description:"Пока вы носите этот доспех, вы получаете бонус +1 к КД. Вы считаетесь владеющим им, даже если обычно не владеете таким доспехом."},"Dragon Scale Mail":{name:"Доспех из драконьей чешуи",description:"Этот доспех даёт бонус +1 к КД и сопротивление одному виду урона в зависимости от вида дракона."},"Dwarven Plate":{name:"Дварфский латный доспех",description:"Пока вы носите этот доспех, вы получаете бонус +2 к КД, и вас нельзя переместить против вашей воли."},"Demon Armor":{name:"Демонический доспех",description:"Этот проклятый латный доспех даёт бонус +1 к КД и позволяет безоружным ударам наносить 1к8 + модификатор Силы рубящего урона."},"Efreeti Chain":{name:"Кольчуга ифрита",description:"Пока вы носите этот доспех, вы получаете бонус +3 к КД, иммунитет к урону огнём и можете говорить на игнане."},"Armor of Invulnerability":{name:"Доспех неуязвимости",description:"Вы получаете сопротивление немагическому урону. Кроме того, действием можно получить иммунитет к немагическому урону на 10 минут."},"Armor of Vulnerability":{name:"Доспех уязвимости",description:  e sei sotto l'effetto dell'incantesimo Benedizione.",rarity:"rare"},"Potion of invulnerability":{nameEN:"Potion of Invulnerability",nameIT:"Pozione di Invulnerabilità",descEN:"For 1 minute, you have resistance to all damage.",descIT:"Per 1 minuto, hai resistenza a tutti i danni.",rarity:"rare"},"Potion of mind reading":{nameEN:"Potion of Mind Reading",nameIT:"Pozione di Lettura del Pensiero",descEN:"When you drink this potion, you gain the effect of the Detect Thoughts spell (DC 13).",descIT:"Quando bevi questa pozione, ottieni l'effetto dell'incantesimo Individuazione dei Pensieri (CD 13).",rarity:"rare"},"Potion of fire giant strength":{nameEN:"Potion of Fire Giant Strength",nameIT:"Pozione di Forza del Gigante del Fuoco",descEN:"Your Strength score changes to 25 for 1 hour.",descIT:"Il tuo punteggio di Forza diventa 25 per 1 ora.",rarity:"rare"},"Potion of invisibility":{nameEN:"Potion of Invisibility",nameIT:"Pozione di Invisibilità",descEN:"You become invisible for 1 hour. The effect ends early if you attack or cast a spell.",descIT:"Diventi invisibile per 1 ora. L'effetto termina prima se attacchi o lanci un incantesimo.",rarity:"very rare"},"Potion of speed":{nameEN:"Potion of Speed",nameIT:"Pozione di Velocità",descEN:"When you drink this potion, you gain the effect of the Haste spell for 1 minute.",descIT:"Quando bevi questa pozione, ottieni l'effetto dell'incantesimo Velocità per 1 minuto.",rarity:"very rare"},"Potion of flying":{nameEN:"Potion of Flying",nameIT:"Pozione di Volo",descEN:"When you drink this potion, you gain a flying speed equal to your walking speed for 1 hour.",descIT:"Quando bevi questa pozione, ottieni una velocità di volo pari alla tua velocità di cammino per 1 ora.",rarity:"very rare"},"Potion of cloud giant strength":{nameEN:"Potion of Cloud Giant Strength",nameIT:"Pozione di Forza del Gigante delle Nuvole",descEN:"Your Strength score changes to 27 for 1 hour.",descIT:"Il tuo punteggio di Forza diventa 27 per 1 ora.",rarity:"very rare"},"Potion of longevity":{nameEN:"Potion of Longevity",nameIT:"Pozione di Longevità",descEN:"When you drink this potion, your physical age is reduced by 1d6 + 6 years.",descIT:"Quando bevi questa pozione, la tua età fisica si riduce di 1d6 + 6 anni.",rarity:"very rare"},"Potion of vitality":{nameEN:"Potion of Vitality",nameIT:"Pozione di Vitalità",descEN:"When you drink this potion, it removes any exhaustion and cures any disease or poison.",descIT:"Quando bevi questa pozione, rimuove ogni livello di sfinimento e cura qualsiasi malattia o veleno.",rarity:"very rare"},"Potion of storm giant strength":{nameEN:"Potion of Storm Giant Strength",nameIT:"Pozione di Forza del Gigante delle Tempeste",descEN:"Your Strength score changes to 29 for 1 hour.",descIT:"Il tuo punteggio di Forza diventa 29 per 1 ora.",rarity:"legendary"},"Potion of poison":{nameEN:"Potion of Poison",nameIT:"Pozione di Veleno",descEN:"This concoction looks and smells like a Potion of Healing but is actually poison. You take 3d6 poison damage.",descIT:"Questa miscela sembra e odora come una Pozione di Guarigione ma in realtà è veleno. Subisci 3d6 danni da veleno.",rarity:"uncommon"},"Potion of comprehension":{nameEN:"Potion of Comprehension",nameIT:"Pozione di Comprensione",descEN:"When you drink this potion, you can comprehend any language for 1 hour.",descIT:"Quando bevi questa pozione, puoi comprendere qualsiasi linguaggio per 1 ora.",rarity:"common"},"Cantrip scroll":{nameEN:"Cantrip Scroll",nameIT:"Pergamena di Trucchetto",descEN:"A spell scroll with a cantrip inscribed on it.",descIT:"Una pergamena magica con un trucchetto iscritto su di essa.",rarity:"common"},"Spell scroll (cantrip)":{nameEN:"Spell Scroll (Cantrip)",nameIT:"Pergamena Magica (Trucchetto)",descEN:"A spell scroll bearing a cantrip. If the spell is on your class's spell list, you can read the scroll and cast the spell.",descIT:"Una pergamena magica con un trucchetto. Se l'incantesimo è nella lista della tua classe, puoi leggerla e lanciare l'incantesimo.",rarity:"common"},"Spell scroll (1st level)":{nameEN:"Spell Scroll (1st Level)",nameIT:"Pergamena Magica (1° Livello)",descEN:"A spell scroll bearing a 1st-level spell.",descIT:"Una pergamena magica con un incantesimo di 1° livello.",rarity:"common"},"Spell scroll (level 1)":{nameEN:"Spell Scroll (Level 1)",nameIT:"Pergamena Magica (1° Livello)",descEN:"A spell scroll bearing a 1st-level spell.",descIT:"Una pergamena magica con un incantesimo di 1° livello.",rarity:"common"},"Spell scroll (2nd level)":{nameEN:"Spell Scroll (2nd Level)",nameIT:"Pergamena Magica (2° Livello)",descEN:"A spell scroll bearing a 2nd-level spell.",descIT:"Una pergamena magica con un incantesimo di 2° livello.",rarity:"uncommon"},"Spell scroll (level 2)":{nameEN:"Spell Scroll (Level 2)",nameIT:"Pergamena Magica (2° Livello)",descEN:"A spell scroll bearing a 2nd-level spell.",descIT:"Una pergamena magica con un incantesimo di 2° livello.",rarity:"uncommon"},"Spell scroll (3rd level)":{nameEN:"Spell Scroll (3rd Level)",nameIT:"Pergamena Magica (3° Livello)",descEN:"A spell scroll bearing a 3rd-level spell.",descIT:"Una pergamena magica con un incantesimo di 3° livello.",rarity:"uncommon"},"Spell scroll (level 3)":{nameEN:"Spell Scroll (Level 3)",nameIT:"Pergamena Magica (3° Livello)",descEN:"A spell scroll bearing a 3rd-level spell.",descIT:"Una pergamena magica con un incantesimo di 3° livello.",rarity:"uncommon"},"Spell scroll (4th level)":{nameEN:"Spell Scroll (4th Level)",nameIT:"Pergamena Magica (4° Livello)",descEN:"A spell scroll bearing a 4th-level spell.",descIT:"Una pergamena magica con un incantesimo di 4° livello.",rarity:"rare"},"Spell scroll (5th level)":{nameEN:"Spell Scroll (5th Level)",nameIT:"Pergamena Magica (5° Livello)",descEN:"A spell scroll bearing a 5th-level spell.",descIT:"Una pergamena magica con un incantesimo di 5° livello.",rarity:"rare"},"Spell scroll (level 5)":{nameEN:"Spell Scroll (Level 5)",nameIT:"Pergamena Magica (5° Livello)",descEN:"A spell scroll bearing a 5th-level spell.",descIT:"Una pergamena magica con un incantesimo di 5° livello.",rarity:"rare"},"Spell scroll (6th level)":{nameEN:"Spell Scroll (6th Level)",nameIT:"Pergamena Magica (6° Livello)",descEN:"A spell scroll bearing a 6th-level spell.",descIT:"Una pergamena magica con un incantesimo di 6° livello.",rarity:"very rare"},"Spell scroll (7th level)":{nameEN:"Spell Scroll (7th Level)",nameIT:"Pergamena Magica (7° Livello)",descEN:"A spell scroll bearing a 7th-level spell.",descIT:"Una pergamena magica con un incantesimo di 7° livello.",rarity:"very rare"},"Spell scroll (level 7)":{nameEN:"Spell Scroll (Level 7)",nameIT:"Pergamena Magica (7° Livello)",descEN:"A spell scroll bearing a 7th-level spell.",descIT:"Una pergamena magica con un incantesimo di 7° livello.",rarity:"very rare"},"Spell scroll (8th level)":{nameEN:"Spell Scroll (8th Level)",nameIT:"Pergamena Magica (8° Livello)",descEN:"A spell scroll bearing an 8th-level spell.",descIT:"Una pergamena magica con un incantesimo di 8° livello.",rarity:"very rare"},"Spell scroll (level 8)":{nameEN:"Spell Scroll (Level 8)",nameIT:"Pergamena Magica (8° Livello)",descEN:"A spell scroll bearing an 8th-level spell.",descIT:"Una pergamena magica con un incantesimo di 8° livello.",rarity:"very rare"},"Spell scroll (9th level)":{nameEN:"Spell Scroll (9th Level)",nameIT:"Pergamena Magica (9° Livello)",descEN:"A spell scroll bearing a 9th-level spell.",descIT:"Una pergamena magica con un incantesimo di 9° livello.",rarity:"legendary"},"Spell scroll (level 9)":{nameEN:"Spell Scroll (Level 9)",nameIT:"Pergamena Magica (9° Livello)",descEN:"A spell scroll bearing a 9th-level spell.",descIT:"Una pergamena magica con un incantesimo di 9° livello.",rarity:"legendary"},"Scroll of protection":{nameEN:"Scroll of Protection",nameIT:"Pergamena di Protezione",descEN:"Using an action to read this scroll creates a barrier that protects against a certain type of creature.",descIT:"Usando un'azione per leggere questa pergamena, crei una barriera che protegge da un certo tipo di creatura.",rarity:"rare"},"Ammunition, +1":{nameEN:"Ammunition, +1",nameIT:"Munizioni, +1",descEN:"You have a +1 bonus to attack and damage rolls made with this piece of magic ammunition.",descIT:"Hai un bonus di +1 ai tiri per colpire e ai danni effettuati con questa munizione magica.",rarity:"uncommon"},"Ammunition, +2":{nameEN:"Ammunition, +2",nameIT:"Munizioni, +2",descEN:"You have a +2 bonus to attack and damage rolls made with this piece of magic ammunition.",descIT:"Hai un bonus di +2 ai tiri per colpire e ai danni effettuati con questa munizione magica.",rarity:"rare"},"Ammunition, +3":{nameEN:"Ammunition, +3",nameIT:"Munizioni, +3",descEN:"You have a +3 bonus to attack and damage rolls made with this piece of magic ammunition.",descIT:"Hai un bonus di +3 ai tiri per colpire e ai danni effettuati con questa munizione magica.",rarity:"very rare"},"Weapon, +1":{nameEN:"Weapon, +1",nameIT:"Arma, +1",descEN:"You have a +1 bonus to attack and damage rolls made with this magic weapon.",descIT:"Hai un bonus di +1 ai tiri per colpire e ai danni effettuati con quest'arma magica.",rarity:"uncommon"},"Weapon, +2":{nameEN:"Weapon, +2",nameIT:"Arma, +2",descEN:"You have a +2 bonus to attack and damage rolls made with this magic weapon.",descIT:"Hai un bonus di +2 ai tiri per colpire e ai danni effettuati con quest'arma magica.",rarity:"rare"},"Weapon, +3":{nameEN:"Weapon, +3",nameIT:"Arma, +3",descEN:"You have a +3 bonus to attack and damage rolls made with this magic weapon.",descIT:"Hai un bonus di +3 ai tiri per colpire e ai danni effettuati con quest'arma magica.",rarity:"very rare"},"Weapon of warning":{nameEN:"Weapon of Warning",nameIT:"Arma dell'Avvertimento",descEN:"This weapon warns its bearer of danger, granting advantage on initiative rolls.",descIT:"Quest'arma avverte il suo portatore del pericolo, garantendo vantaggio ai tiri di iniziativa.",rarity:"uncommon"},"Sword of vengeance":{nameEN:"Sword of Vengeance",nameIT:"Spada della Vendetta",descEN:"This cursed weapon is a +1 weapon that becomes a -2 weapon when you are below half HP.",descIT:"Quest'arma maledetta è un'arma +1 che quando sei sotto metà PF diventa un'arma -2.",rarity:"uncommon"},"Vicious weapon":{nameEN:"Vicious Weapon",nameIT:"Arma Feroce",descEN:"When you roll a 20 on your attack roll, the target takes an extra 7 damage.",descIT:"Quando ottieni un 20 al tiro per colpire, il bersaglio subisce 7 danni extra.",rarity:"rare"},"Sword of life stealing":{nameEN:"Sword of Life Stealing",nameIT:"Spada del Furto Vitale",descEN:"When you attack with this weapon and roll a 20, the target takes 10 extra necrotic damage and you gain 10 temporary HP.",descIT:"Quando attacchi con quest'arma e ottieni 20, il bersaglio subisce 10 danni necrotici extra e tu ottieni 10 PF temporanei.",rarity:"rare"},"Sword of wounding":{nameEN:"Sword of Wounding",nameIT:"Spada delle Ferite",descEN:"Hit points lost to this weapon can only be regained through a short or long rest.",descIT:"I punti ferita persi a causa di quest'arma possono essere recuperati solo tramite un riposo breve o lungo.",rarity:"rare"},"Sun blade":{nameEN:"Sun Blade",nameIT:"Lama Solare",descEN:"This item appears to be a longsword hilt. While grasping the hilt, you can use a bonus action to create a blade of pure radiance.",descIT:"Questo oggetto sembra un'elsa di spada lunga. Mentre impugni l'elsa, puoi usare un'azione bonus per creare una lama di pura luminosità.",rarity:"rare"},"Flame tongue":{nameEN:"Flame Tongue",nameIT:"Lingua di Fuoco",descEN:"You can use a bonus action to speak this weapon's command word, causing flames to erupt from the blade, dealing extra 2d6 fire damage.",descIT:"Puoi usare un'azione bonus per pronunciare la parola di comando di quest'arma, facendo eruttare fiamme dalla lama, infliggendo 2d6 danni da fuoco extra.",rarity:"rare"},"Frost brand":{nameEN:"Frost Brand",nameIT:"Lama del Gelo",descEN:"When you hit with this magic sword, the target takes an extra 1d6 cold damage. You also gain resistance to fire damage.",descIT:"Quando colpisci con questa spada magica, il bersaglio subisce 1d6 danni da freddo extra. Ottieni anche resistenza ai danni da fuoco.",rarity:"very rare"},"Dragon slayer":{nameEN:"Dragon Slayer",nameIT:"Uccisore di Draghi",descEN:"You gain a +1 bonus to attack and damage rolls made with this weapon. When you hit a dragon, it takes an extra 3d6 damage.",descIT:"Ottieni un bonus di +1 ai tiri per colpire e ai danni con quest'arma. Quando colpisci un drago, subisce 3d6 danni extra.",rarity:"rare"},"Giant slayer":{nameEN:"Giant Slayer",nameIT:"Uccisore di Giganti",descEN:"You gain a +1 bonus to attack and damage rolls. When you hit a giant, it takes an extra 2d6 damage and must make a DC 15 Strength save.",descIT:"Ottieni un bonus di +1 ai tiri per colpire e ai danni. Quando colpisci un gigante, subisce 2d6 danni extra e deve effettuare un TS su Forza CD 15.",rarity:"rare"},"Dagger of venom":{nameEN:"Dagger of Venom",nameIT:"Pugnale del Veleno",descEN:"You gain a +1 bonus to attack and damage rolls with this dagger. You can coat the blade in poison once per day.",descIT:"Ottieni un bonus di +1 ai tiri per colpire e ai danni con questo pugnale. Puoi rivestire la lama di veleno una volta al giorno.",rarity:"rare"},"Javelin of lightning":{nameEN:"Javelin of Lightning",nameIT:"Giavellotto del Fulmine",descEN:"When you hurl this javelin and speak its command word, it transforms into a bolt of lightning.",descIT:"Quando scagli questo giavellotto e pronunci la sua parola di comando, si trasforma in un fulmine.",rarity:"uncommon"},"Trident of fish command":{nameEN:"Trident of Fish Command",nameIT:"Tridente del Comando dei Pesci",descEN:"This trident is a magic weapon. It has 3 charges that let you cast Dominate Beast (DC 15) on beasts with swimming speed.",descIT:"Questo tridente è un'arma magica. Ha 3 cariche che ti permettono di lanciare Dominare Bestie (CD 15) su bestie con velocità di nuoto.",rarity:"uncommon"},"Berserker axe":{nameEN:"Berserker Axe",nameIT:"Ascia del Berserker",descEN:"You gain a +1 bonus to attack and damage rolls with this axe. This cursed axe drives you to fight.",descIT:"Ottieni un bonus di +1 ai tiri per colpire e ai danni con quest'ascia. Quest'ascia maledetta ti spinge a combattere.",rarity:"rare"},"Dancing sword":{nameEN:"Dancing Sword",nameIT:"Spada Danzante",descEN:"You can use a bonus action to toss this magic sword into the air and speak the command word. It hovers and attacks on its own.",descIT:"Puoi usare un'azione bonus per lanciare questa spada magica in aria e pronunciare la parola di comando. Fluttua e attacca da sola.",rarity:"very rare"},"Sword of sharpness":{nameEN:"Sword of Sharpness",nameIT:"Spada dell'Affilatura",descEN:"When you roll a 20 on an attack roll, the target takes an extra 14 slashing damage. On a critical hit, you might sever a limb.",descIT:"Quando ottieni 20 al tiro per colpire, il bersaglio subisce 14 danni taglienti extra. Con un colpo critico, potresti recidere un arto.",rarity:"very rare"},"Nine lives stealer":{nameEN:"Nine Lives Stealer",nameIT:"Ladro di Nove Vite",descEN:"This sword has 1d8+1 charges. On a critical hit, if the target has fewer than 100 HP, it must make a DC 15 Con save or die.",descIT:"Questa spada ha 1d8+1 cariche. Con un colpo critico, se il bersaglio ha meno di 100 PF, deve effettuare un TS su Cos CD 15 o morire.",rarity:"very rare"},"Scimitar of speed":{nameEN:"Scimitar of Speed",nameIT:"Scimitarra della Velocità",descEN:"You gain a +2 bonus to attack and damage rolls. You can make one attack as a bonus action on each of your turns.",descIT:"Ottieni un bonus di +2 ai tiri per colpire e ai danni. Puoi effettuare un attacco come azione bonus in ognuno dei tuoi turni.",rarity:"very rare"},"Vorpal sword":{nameEN:"Vorpal Sword",nameIT:"Spada Vorpal",descEN:"You gain a +3 bonus to attack and damage rolls. When you roll a 20 on an attack roll, you cut off one of the target's heads.",descIT:"Ottieni un bonus di +3 ai tiri per colpire e ai danni. Quando ottieni 20 al tiro per colpire, tagli una delle teste del bersaglio.",rarity:"legendary"},Defender:{nameEN:"Defender",nameIT:"Difensore",descEN:"You gain a +3 bonus to attack and damage rolls. You can transfer some or all of this bonus to your AC.",descIT:"Ottieni un bonus di +3 ai tiri per colpire e ai danni. Puoi trasferire parte o tutto questo bonus alla tua CA.",rarity:"legendary"},"Holy avenger":{nameEN:"Holy Avenger",nameIT:"Vendicatore Sacro",descEN:"A paladin who attunes to this weapon gains a +3 bonus and deals extra radiant damage to fiends and undead.",descIT:"Un paladino che si sintonizza con quest'arma ottiene un bonus di +3 e infligge danni radiosi extra a immondi e non morti.",rarity:"legendary"},"Luck blade":{nameEN:"Luck Blade",nameIT:"Lama della Fortuna",descEN:"You gain a +1 bonus to attack and damage rolls, and a +1 bonus to saving throws. This sword has 1d4-1 charges for Wish.",descIT:"Ottieni un bonus di +1 ai tiri per colpire, ai danni e ai tiri salvezza. Questa spada ha 1d4-1 cariche per Desiderio.",rarity:"legendary"},"Sword of answering":{nameEN:"Sword of Answering",nameIT:"Spada della Risposta",descEN:"You gain a +3 bonus to attack and damage rolls. You can use your reaction to make a melee attack when a creature within reach attacks you.",descIT:"Ottieni un bonus di +3 ai tiri per colpire e ai danni. Puoi usare la tua reazione per effettuare un attacco in mischia quando una creatura a portata ti attacca.",rarity:"legendary"},"Hammer of thunderbolts":{nameEN:"Hammer of Thunderbolts",nameIT:"Martello dei Fulmini",descEN:"A giant-slaying weapon that grants a +1 bonus and can stun giants. Becomes +3 when attuned with special items.",descIT:"Un'arma uccisore di giganti che garantisce un bonus di +1 e può stordire i giganti. Diventa +3 quando sintonizzata con oggetti speciali.",rarity:"legendary"},"Mace of disruption":{nameEN:"Mace of Disruption",nameIT:"Mazza della Distruzione",descEN:"When you hit a fiend or undead, it takes an extra 2d6 radiant damage.",descIT:"Quando colpisci un immondo o non morto, subisce 2d6 danni radiosi extra.",rarity:"rare"},"Mace of smiting":{nameEN:"Mace of Smiting",nameIT:"Mazza dello Smembramento",descEN:"You gain a +1 bonus to attack and damage rolls, or +3 against constructs. On a critical hit against a construct, deal 7 extra damage.",descIT:"Ottieni un bonus di +1 ai tiri per colpire e ai danni, o +3 contro costrutti. Con un colpo critico contro un costrutto, infliggi 7 danni extra.",rarity:"rare"},"Mace of terror":{nameEN:"Mace of Terror",nameIT:"Mazza del Terrore",descEN:"This magic weapon has 3 charges. You can expend 1 charge to frighten creatures within 30 feet.",descIT:"Quest'arma magica ha 3 cariche. Puoi spendere 1 carica per spaventare le creature entro 9 metri.",rarity:"rare"},"Tentacle rod":{nameEN:"Tentacle Rod",nameIT:"Verga dei Tentacoli",descEN:"Made by the drow, this rod has three tentacles that attack on their own when you hold the rod.",descIT:"Creata dai drow, questa verga ha tre tentacoli che attaccano da soli quando impugni la verga.",rarity:"rare"},"Dwarven thrower":{nameEN:"Dwarven Thrower",nameIT:"Lanciatrice Nanica",descEN:"This magic warhammer grants a +3 bonus. When thrown, it deals extra damage and returns to your hand.",descIT:"Questo martello da guerra magico garantisce un bonus di +3. Quando lanciato, infligge danni extra e torna nella tua mano.",rarity:"very rare"},Oathbow:{nameEN:"Oathbow",nameIT:"Arco del Giuramento",descEN:"When you nock an arrow and speak the command word, you can swear an oath against your enemy, gaining advantage on attacks.",descIT:"Quando incochi una freccia e pronunci la parola di comando, puoi giurare contro il tuo nemico, ottenendo vantaggio agli attacchi.",rarity:"very rare"},"Arrow of slaying":{nameEN:"Arrow of Slaying",nameIT:"Freccia dell'Uccisione",descEN:"If a creature of the specific type takes damage from this arrow, it must make a DC 17 Con save, taking 6d10 piercing damage on a failure.",descIT:"Se una creatura del tipo specifico subisce danni da questa freccia, deve effettuare un TS su Cos CD 17, subendo 6d10 danni perforanti se fallisce.",rarity:"very rare"},"Moon-touched sword":{nameEN:"Moon-Touched Sword",nameIT:"Spada Lunare",descEN:"In darkness, the unsheathed blade of this sword sheds moonlight, creating bright light in a 15-foot radius.",descIT:"Nell'oscurità, la lama sguainata di questa spada emette luce lunare, creando luce intensa in un raggio di 4,5 metri.",rarity:"common"},"Silvered weapon":{nameEN:"Silvered Weapon",nameIT:"Arma Argentata",descEN:"A weapon coated in silver, effective against creatures vulnerable to silver.",descIT:"Un'arma rivestita d'argento, efficace contro creature vulnerabili all'argento.",rarity:"common"},"Unbreakable arrow":{nameEN:"Unbreakable Arrow",nameIT:"Freccia Indistruttibile",descEN:"This arrow can't be broken, except when it is within an antimagic field.",descIT:"Questa freccia non può essere spezzata, tranne quando si trova all'interno di un campo antimagia.",rarity:"common"},"Walloping ammunition":{nameEN:"Walloping Ammunition",nameIT:"Munizioni Devastanti",descEN:"On a hit, the target must succeed on a DC 10 Strength save or be knocked prone.",descIT:"In caso di colpo, il bersaglio deve superare un TS su Forza CD 10 o essere atterrato.",rarity:"common"},"Shield, +1":{nameEN:"Shield, +1",nameIT:"Scudo, +1",descEN:"While holding this shield, you have an additional +1 bonus to AC beyond the shield's normal bonus.",descIT:"Mentre impugni questo scudo, hai un bonus aggiuntivo di +1 alla CA oltre al normale bonus dello scudo.",rarity:"uncommon"},"Shield, +2":{nameEN:"Shield, +2",nameIT:"Scudo, +2",descEN:"While holding this shield, you have an additional +2 bonus to AC.",descIT:"Mentre impugni questo scudo, hai un bonus aggiuntivo di +2 alla CA.",rarity:"rare"},"Shield, +3":{nameEN:"Shield, +3",nameIT:"Scudo, +3",descEN:"While holding this shield, you have an additional +3 bonus to AC.",descIT:"Mentre impugni questo scudo, hai un bonus aggiuntivo di +3 alla CA.",rarity:"very rare"},"Sentinel shield":{nameEN:"Sentinel Shield",nameIT:"Scudo Sentinella",descEN:"While holding this shield, you have advantage on initiative rolls and Wisdom (Perception) checks.",descIT:"Mentre impugni questo scudo, hai vantaggio ai tiri di iniziativa e alle prove di Saggezza (Percezione).",rarity:"uncommon"},"Arrow-catching shield":{nameEN:"Arrow-Catching Shield",nameIT:"Scudo Acchiappafreccce",descEN:"You gain a +2 bonus to AC against ranged attacks while wielding this shield.",descIT:"Ottieni un bonus di +2 alla CA contro attacchi a distanza mentre impugni questo scudo.",rarity:"rare"},"Shield of missile attraction":{nameEN:"Shield of Missile Attraction",nameIT:"Scudo di Attrazione dei Proiettili",descEN:"This cursed shield gives you resistance to ranged attacks but all ranged attacks target you.",descIT:"Questo scudo maledetto ti dà resistenza agli attacchi a distanza ma tutti gli attacchi a distanza ti prendono di mira.",rarity:"rare"},"Animated shield":{nameEN:"Animated Shield",nameIT:"Scudo Animato",descEN:"You can use a bonus action to cause the shield to fly and protect you without you holding it.",descIT:"Puoi usare un'azione bonus per far volare lo scudo e proteggerti senza impugnarlo.",rarity:"very rare"},"Spellguard shield":{nameEN:"Spellguard Shield",nameIT:"Scudo Guardincantesimi",descEN:"You have advantage on saving throws against spells and spell effects.",descIT:"Hai vantaggio ai tiri salvezza contro incantesimi e effetti magici.",rarity:"very rare"},"Shield of expression":{nameEN:"Shield of Expression",nameIT:"Scudo dell'Espressione",descEN:"The front of this shield is shaped in the likeness of a face. You can change the shield's expression.",descIT:"La parte frontale di questo scudo ha la forma di un viso. Puoi cambiare l'espressione dello scudo.",rarity:"common"},"Adamantine armor":{nameEN:"Adamantine Armor",nameIT:"Armatura di Adamantio",descEN:"This armor is reinforced with adamantine. Any critical hit against you becomes a normal hit.",descIT:"Questa armatura è rinforzata con adamantio. Qualsiasi colpo critico contro di te diventa un colpo normale.",rarity:"uncommon"},"Mithral armor":{nameEN:"Mithral Armor",nameIT:"Armatura di Mithral",descEN:"Mithral is a light, flexible metal. If the armor normally imposes disadvantage on Stealth, it doesn't.",descIT:"Il mithral è un metallo leggero e flessibile. Se l'armatura normalmente impone svantaggio alla Furtività, non lo fa.",rarity:"uncommon"},"Mariner's armor":{nameEN:"Mariner's Armor",nameIT:"Armatura del Marinaio",descEN:"While wearing this armor, you have a swimming speed equal to your walking speed.",descIT:"Mentre indossi questa armatura, hai una velocità di nuoto pari alla tua velocità di cammino.",rarity:"uncommon"},"Glamoured studded leather":{nameEN:"Glamoured Studded Leather",nameIT:"Cuoio Borchiato dell'Illusione",descEN:"While wearing this armor, you can use a bonus action to change its appearance.",descIT:"Mentre indossi questa armatura, puoi usare un'azione bonus per cambiarne l'aspetto.",rarity:"rare"},"Elven chain":{nameEN:"Elven Chain",nameIT:"Cotta di Maglia Elfica",descEN:"You gain a +1 bonus to AC while wearing this armor. You are considered proficient with it even if you lack proficiency.",descIT:"Ottieni un bonus di +1 alla CA mentre indossi questa armatura. Sei considerato competente anche se non lo sei normalmente.",rarity:"rare"},"Dragon scale mail":{nameEN:"Dragon Scale Mail",nameIT:"Maglia di Scaglie di Drago",descEN:"This armor grants a +1 bonus to AC and resistance to one type of damage based on the dragon.",descIT:"Questa armatura garantisce un bonus di +1 alla CA e resistenza a un tipo di danno basato sul drago.",rarity:"very rare"},"Dwarven plate":{nameEN:"Dwarven Plate",nameIT:"Armatura a Piastre Nanica",descEN:"While wearing this armor, you gain a +2 bonus to AC and
